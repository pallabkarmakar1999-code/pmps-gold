<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PMPS GOLD - Dashboard</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fffdf7;
    color: #333;
}

header {
    background: white;
    color: #b8860b;
    padding: 20px;
    font-size: 24px;
    font-weight: bold;
    box-shadow: 0 2px 8px #ddd;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 20px;
    margin: 15px 0;
    border-radius: 12px;
    box-shadow: 0 2px 10px #ddd;
}

h2 {
    color: #b8860b;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    background: #b8860b;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:active {
    transform: scale(.96);
    background: #8a6500;
}

.logout {
    background: #b22222;
}

a {
    text-decoration: none;
    color: #b8860b;
}

.notification-count {
    background: #e63946;
    color: white;
    padding: 3px 9px;
    border-radius: 20px;
    font-size: 13px;
    margin-left: 5px;
}

.notification {
    padding: 13px;
    margin: 12px 0;
    border-radius: 8px;
    background: #fff4d6;
    border-left: 4px solid #b8860b;
}

.notification.read {
    background: #f1f1f1;
    border-left-color: #999;
}

.notification p {
    margin: 7px 0;
    overflow-wrap: anywhere;
}

.notification small {
    color: #777;
}

#notificationList {
    display: none;
}

</style>
</head>

<body>

<header>PMPS GOLD</header>

<div class="container">

<h2>My Dashboard</h2>


<!-- CUSTOMER INFORMATION -->

<div class="card">

<h3>Welcome Customer!</h3>

<p>Mobile Number:</p>

<b id="mobile">Loading...</b>

</div>


<!-- NOTIFICATIONS -->

<div class="card">

<h3>🔔 My Notifications</h3>

<p id="notificationInfo">
Loading Notifications...
</p>

<button id="notificationButton">
View Notifications
</button>

<div id="notificationList"></div>

</div>


<!-- ACCOUNT -->

<div class="card">

<h3>My Account</h3>

<p>👤 <a href="profile.html">My Profile</a></p>

<p>📦 <a href="my-orders.html">My Orders</a></p>

<p>❤️ <a href="wishlist.html">My Wishlist</a></p>

<p>🔔 <a href="#notifications" id="notificationLink">My Notifications</a></p>

<p>📍 My Addresses</p>

<p>🎧 Customer Support</p>

</div>


<!-- SHOPPING -->

<div class="card">

<h3>Shopping</h3>

<button onclick="location.href='index.html'">
Continue Shopping
</button>

<button onclick="location.href='track.html'">
Track My Order
</button>

</div>


<button class="logout" id="logoutButton">
Logout
</button>

</div>


<script type="module">

import { auth, db } from "./firebase.js";

import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

import {
    collection,
    query,
    where,
    orderBy,
    getDocs,
    doc,
    updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";


const mobile = document.getElementById("mobile");

const notificationInfo =
document.getElementById("notificationInfo");

const notificationList =
document.getElementById("notificationList");

const notificationButton =
document.getElementById("notificationButton");

let currentUser = null;

let notificationsLoaded = false;


// AUTHENTICATION

onAuthStateChanged(auth, async function(user) {

    if (user) {

        currentUser = user;

        mobile.innerText =
        user.phoneNumber || "Phone number unavailable";

        await loadNotifications();

    } else {

        window.location.href = "customer-login.html";

    }

});


// LOAD NOTIFICATIONS

async function loadNotifications() {

    if (!currentUser) return;

    notificationInfo.innerText =
    "Loading Notifications...";

    try {

        const q = query(

            collection(db, "Notifications"),

            where("userId", "==", currentUser.uid),

            orderBy("createdAt", "desc")

        );


        const snapshot = await getDocs(q);

        notificationList.innerHTML = "";

        let unread = 0;


        if (snapshot.empty) {

            notificationInfo.innerText =
            "You have no notifications.";

            notificationButton.innerText =
            "View Notifications";

            return;

        }


        snapshot.forEach(notificationDoc => {

            const data = notificationDoc.data();

            const id = notificationDoc.id;

            if (data.read !== true) {

                unread++;

            }


            const div = document.createElement("div");

            div.className =
            data.read === true
            ? "notification read"
            : "notification";


            const title = document.createElement("h4");

            title.textContent =
            data.title || "Order Notification";


            const message = document.createElement("p");

            message.textContent =
            data.message || "Your order has been updated.";


            const status = document.createElement("p");

            status.textContent =
            "Order Status: " + (data.status || "Pending");


            const orderId = document.createElement("small");

            orderId.textContent =
            "Order ID: " + (data.orderId || "");


            const readButton = document.createElement("button");

            readButton.textContent =
            data.read === true
            ? "Already Read"
            : "Mark as Read";


            readButton.disabled = data.read === true;


            readButton.onclick = async function() {

                try {

                    await updateDoc(

                        doc(db, "Notifications", id),

                        {
                            read: true
                        }

                    );

                    await loadNotifications();

                } catch(error) {

                    alert(
                        "Notification Update Failed: " +
                        error.message
                    );

                }

            };


            div.append(
                title,
                message,
                status,
                orderId,
                readButton
            );


            notificationList.appendChild(div);

        });


        notificationInfo.innerHTML =
        "Total Notifications: " + snapshot.size +
        "<br>Unread Notifications: " + unread;


        notificationButton.innerText =
        unread > 0
        ? "🔔 View Notifications (" + unread + " New)"
        : "View Notifications";


        notificationsLoaded = true;


    } catch(error) {

        console.error(error);

        notificationInfo.innerText =
        "Unable to load notifications: " + error.message;

    }

}


// SHOW / HIDE NOTIFICATIONS

notificationButton.onclick = function() {

    if (!notificationsLoaded) {

        loadNotifications();

        return;

    }

    if (notificationList.style.display === "block") {

        notificationList.style.display = "none";

        notificationButton.innerText =
        "View Notifications";

    } else {

        notificationList.style.display = "block";

        loadNotifications();

    }

};


// NOTIFICATION LINK

document.getElementById("notificationLink").onclick =
function() {

    notificationList.style.display = "block";

    notificationList.scrollIntoView({
        behavior: "smooth"
    });

    loadNotifications();

};


// LOGOUT

document.getElementById("logoutButton").onclick =
async function() {

    try {

        await signOut(auth);

        window.location.href =
        "customer-login.html";

    } catch(error) {

        alert("Logout Error: " + error.message);

    }

};

</script>

</body>
</html>
