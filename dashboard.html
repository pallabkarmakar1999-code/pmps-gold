<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMPS GOLD Admin Dashboard</title>

<link rel="stylesheet" href="../assets/css/admin.css">
<link rel="stylesheet" href="../assets/css/responsive.css">

<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f5f5}
header{background:#b8860b;color:white;padding:18px;display:flex;justify-content:space-between;align-items:center}
header h2{margin:0}
.logout{background:white;color:#9b7200;border:0;padding:10px 15px;border-radius:6px;font-weight:bold}
.container{padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:15px}
.card{background:white;padding:22px 12px;text-align:center;border-radius:12px;box-shadow:0 2px 8px #ddd;text-decoration:none;color:#333;font-weight:bold}
.card span{display:block;font-size:30px;margin-bottom:10px}
</style>
</head>

<body>

<header>
    <h2>👑 PMPS GOLD ADMIN</h2>
    <button class="logout" id="logoutBtn">LOGOUT</button>
</header>

<div class="container">
    <h2>Admin Dashboard</h2>
    <p>আপনার Store Management Panel</p>

    <div class="grid">
        <a class="card" href="products/index.html"><span>📦</span>Products</a>
        <a class="card" href="orders/index.html"><span>🛒</span>Orders</a>
        <a class="card" href="offers/index.html"><span>🎁</span>Offers</a>
        <a class="card" href="banners/index.html"><span>🖼️</span>Banners</a>
        <a class="card" href="festivals/index.html"><span>🎉</span>Festivals</a>
        <a class="card" href="customers/index.html"><span>👥</span>Customers</a>
        <a class="card" href="homepage/index.html"><span>🏠</span>Homepage</a>
        <a class="card" href="settings/index.html"><span>⚙️</span>Settings</a>
    </div>
</div>

<script type="module">
import { auth } from "../firebase.js";
import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const ADMIN_UID = "k1iqKlSU1pYk16SNnWfajy7EdIw2";

onAuthStateChanged(auth, async (user) => {
    if (!user || user.uid !== ADMIN_UID) {
        await signOut(auth);
        window.location.replace("./index.html");
    }
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
    await signOut(auth);
    window.location.replace("./index.html");
});
</script>

</body>
</html>
