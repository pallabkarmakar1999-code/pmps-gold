<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMPS GOLD - My Orders</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fffdf7;
    color: #333;
}

#siteNav {
    width: 100%;
}

header {
    background: white;
    color: #b8860b;
    padding: 20px;
    font-size: 24px;
    font-weight: bold;
    box-shadow: 0 2px 8px #ddd;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 20px;
}

.order {
    background: white;
    padding: 18px;
    margin: 15px 0;
    border-radius: 12px;
    box-shadow: 0 2px 10px #ddd;
    overflow-wrap: anywhere;
}

.status {
    color: #b8860b;
    font-weight: bold;
    font-size: 18px;
}

.product-item {
    display: flex;
    gap: 12px;
    align-items: center;
    border: 1px solid #eee;
    padding: 10px;
    margin: 10px 0;
    border-radius: 10px;
}

.product-img {
    width: 90px;
    height: 90px;
    object-fit: cover;
    border-radius: 8px;
    background: #f5f5f5;
    flex-shrink: 0;
}

.product-info {
    flex: 1;
}

.product-info p {
    margin: 5px 0;
    font-size: 14px;
}

button {
    padding: 12px;
    width: 100%;
    background: #b8860b;
    color: white;
    border: none;
    border-radius: 8px;
    margin-top: 10px;
    cursor: pointer;
}

button:active {
    transform: scale(.97);
    background: #8a6500;
}

.empty {
    background: white;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
}

.order-total {
    font-size: 18px;
    font-weight: bold;
    color: #333;
}

</style>
</head>

<body>

<div id="siteNav">
    <p style="text-align:center;padding:15px;">
        Loading Menu...
    </p>
</div>

<header>PMPS GOLD</header>

<div class="container">

<h2>📦 My Orders</h2>

<div id="orders">Loading Orders...</div>

<button onclick="location.href='./dashboard.html'">
Back to Dashboard
</button>

</div>

<script src="./nav.js"></script>

<script type="module">

import { db, auth } from "./firebase.js";

import {
    collection,
    query,
    where,
    getDocs
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";


const ordersDiv = document.getElementById("orders");


function getImage(product) {

    return product.imageUrl ||
           product.image ||
           product.photo ||
           product.img ||
           product.productImage ||
           (product.images && product.images[0]) ||
           "";

}


onAuthStateChanged(auth, async function(user) {

    if (!user) {

        window.location.href = "./customer-login.html";

        return;

    }


    try {

        const q = query(
            collection(db, "Orders"),
            where("userId", "==", user.uid)
        );


        const snapshot = await getDocs(q);


        if (snapshot.empty) {

            ordersDiv.innerHTML = `
                <div class="empty">
                    <h3>📦 No Orders Found</h3>
                    <p>You have no orders yet.</p>
                    <button onclick="location.href='./index.html'">
                        Start Shopping
                    </button>
                </div>
            `;

            return;

        }


        ordersDiv.innerHTML = "";


        snapshot.forEach(function(orderDoc) {

            const order = orderDoc.data();

            const date = order.createdAt?.toDate
                ? order.createdAt.toDate().toLocaleDateString()
                : "Date unavailable";


            const card = document.createElement("div");

            card.className = "order";


            // ORDER ID

            const title = document.createElement("h3");

            title.textContent = "Order ID: " + orderDoc.id;


            // PRODUCTS CONTAINER

            const productsDiv = document.createElement("div");


            const products = order.products || [];


            products.forEach(function(p) {

                const itemDiv = document.createElement("div");

                itemDiv.className = "product-item";


                // PRODUCT IMAGE

                const img = document.createElement("img");

                img.className = "product-img";

                img.src = getImage(p);

                img.alt = p.name || "Product";

                img.onerror = function() {

                    img.style.display = "none";

                };


                // PRODUCT DETAILS

                const info = document.createElement("div");

                info.className = "product-info";


                const name = document.createElement("h4");

                name.textContent = p.name || "Product";


                const price = document.createElement("p");

                price.textContent =
                    "Price: ₹" + (p.price || 0);


                const quantity = document.createElement("p");

                quantity.textContent =
                    "Quantity: " + (p.quantity || 1);


                const type = document.createElement("p");

                type.textContent =
                    "Type: " +
                    (p.orderType === "wholesale"
                    ? "Wholesale"
                    : "Retail");


                info.append(
                    name,
                    price,
                    quantity,
                    type
                );


                itemDiv.append(
                    img,
                    info
                );


                productsDiv.appendChild(itemDiv);

            });


            // TOTAL

            const total = document.createElement("p");

            total.className = "order-total";

            total.textContent =
                "Total Amount: ₹" +
                (order.totalAmount || 0);


            // DATE

            const orderDate = document.createElement("p");

            orderDate.textContent =
                "Date: " + date;


            // STATUS

            const status = document.createElement("p");

            status.className = "status";

            status.textContent =
                "Status: " + (order.status || "Pending");


            // DETAILS BUTTON

            const invoiceBtn = document.createElement("button");

            invoiceBtn.textContent =
                "View Order Details & Invoice";


            invoiceBtn.onclick = function() {

                window.location.href =
                "./order-details.html?id=" +
                encodeURIComponent(orderDoc.id);

            };


            card.append(
                title,
                productsDiv,
                total,
                orderDate,
                status,
                invoiceBtn
            );


            ordersDiv.appendChild(card);

        });


    } catch(error) {

        ordersDiv.textContent =
        "Error: " + error.message;

        console.error(error);

    }

});

</script>

</body>
</html>
