<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMPS GOLD - Customer Login</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fffdf7;
}

.container {
    max-width: 400px;
    margin: 50px auto;
    padding: 25px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 3px 15px #ddd;
    text-align: center;
}

h2 {
    color: #b8860b;
}

input {
    width: 100%;
    padding: 14px;
    margin: 9px 0;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    background: #b8860b;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
}

#message {
    margin-top: 15px;
    overflow-wrap: anywhere;
}

.switch {
    color: #b8860b;
    cursor: pointer;
    font-weight: bold;
}
</style>
</head>

<body>

<div id="siteNav">
    <p style="text-align:center;padding:15px;">
        Loading Menu...
    </p>
</div>

<div class="container">

    <h2>PMPS GOLD</h2>

    <h3 id="formTitle">Customer Login</h3>

    <input
        id="name"
        type="text"
        placeholder="Your Full Name"
        style="display:none;"
    >

    <input
        id="phone"
        type="tel"
        placeholder="10 Digit Mobile Number"
        maxlength="10"
    >

    <input
        id="email"
        type="email"
        placeholder="Email Address"
        autocomplete="email"
    >

    <input
        id="password"
        type="password"
        placeholder="Password (Minimum 6 Characters)"
        autocomplete="current-password"
    >

    <button id="mainBtn" onclick="handleAuth()">
        Login
    </button>

    <p id="switchText">
        New customer?
        <span class="switch" onclick="toggleMode()">
            Create Account
        </span>
    </p>

    <p id="message"></p>

</div>

<script src="./nav.js"></script>

<script type="module">

import { auth, db } from "./firebase.js";

import {
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    updateProfile
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

import {
    doc,
    setDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";


let isRegister = false;


window.toggleMode = function() {

    isRegister = !isRegister;

    document.getElementById("formTitle").innerText =
        isRegister ? "Create Account" : "Customer Login";

    document.getElementById("name").style.display =
        isRegister ? "block" : "none";

    document.getElementById("mainBtn").innerText =
        isRegister ? "Create Account" : "Login";

    document.getElementById("switchText").innerHTML =
        isRegister
        ? 'Already have an account? <span class="switch" onclick="toggleMode()">Login</span>'
        : 'New customer? <span class="switch" onclick="toggleMode()">Create Account</span>';

    document.getElementById("message").innerText = "";

};


window.handleAuth = async function() {

    const name =
        document.getElementById("name").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    const button =
        document.getElementById("mainBtn");


    if (!/^[6-9]\d{9}$/.test(phone)) {
        message.innerText =
            "Enter a valid 10 digit Indian mobile number.";
        return;
    }

    if (!email) {
        message.innerText = "Enter your email address.";
        return;
    }

    if (password.length < 6) {
        message.innerText =
            "Password must contain at least 6 characters.";
        return;
    }

    if (isRegister && !name) {
        message.innerText = "Enter your full name.";
        return;
    }


    button.disabled = true;

    message.innerText =
        isRegister ? "Creating account..." : "Logging in...";


    try {

        let userCredential;

        if (isRegister) {

            userCredential = await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );

            await updateProfile(userCredential.user, {
                displayName: name
            });

        } else {

            userCredential = await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

        }


        const user = userCredential.user;


        await setDoc(
            doc(db, "Customers", user.uid),
            {
                name: isRegister
                    ? name
                    : (user.displayName || ""),

                email: user.email,

                phone: phone,

                updatedAt: serverTimestamp()

            },
            { merge: true }
        );


        message.innerText = "Login Successful!";

        window.location.href = "./dashboard.html";


    } catch(error) {

        console.error(error);

        if (error.code === "auth/email-already-in-use") {
            message.innerText =
                "This email is already registered. Please Login.";
        }

        else if (error.code === "auth/invalid-credential") {
            message.innerText =
                "Incorrect email or password.";
        }

        else if (error.code === "auth/weak-password") {
            message.innerText =
                "Please use a stronger password.";
        }

        else if (error.code === "auth/invalid-email") {
            message.innerText =
                "Please enter a valid email address.";
        }

        else {
            message.innerText = error.message;
        }

    } finally {

        button.disabled = false;

    }

};

</script>

</body>
</html>
