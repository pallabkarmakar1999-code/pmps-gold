<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMPS GOLD - Customer Login</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fffdf7;
}

#siteNav {
    width: 100%;
}

.container {
    max-width: 400px;
    margin: 70px auto;
    padding: 25px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 3px 15px #ddd;
    text-align: center;
}

h2 {
    color: #b8860b;
}

input {
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    background: #b8860b;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

#message {
    margin-top: 15px;
    overflow-wrap: anywhere;
}
</style>
</head>

<body>

<!-- COMMON NAVIGATION -->

<div id="siteNav">
    <p style="text-align:center;padding:15px;">
        Loading Menu...
    </p>
</div>

<div class="container">

    <h2>PMPS GOLD</h2>

    <h3>Customer Login</h3>

    <input
        id="phone"
        type="tel"
        placeholder="+91XXXXXXXXXX"
        autocomplete="tel"
    >

    <div id="recaptcha-container"></div>

    <button id="sendBtn" onclick="sendOTP()">
        Get OTP
    </button>

    <input
        id="otp"
        type="text"
        inputmode="numeric"
        maxlength="6"
        placeholder="Enter 6 Digit OTP"
        autocomplete="one-time-code"
    >

    <button id="verifyBtn" onclick="verifyOTP()">
        Verify & Login
    </button>

    <p id="message"></p>

</div>

<!-- COMMON NAVIGATION SCRIPT -->

<script src="./nav.js"></script>


<script type="module">

import { auth } from "./firebase.js";

import {
    RecaptchaVerifier,
    signInWithPhoneNumber
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";


let confirmationResult = null;


// SEND OTP

window.sendOTP = async function() {

    const phone =
        document.getElementById("phone").value.trim();

    const message =
        document.getElementById("message");

    const sendBtn =
        document.getElementById("sendBtn");


    if (!/^\+91[6-9]\d{9}$/.test(phone)) {

        message.innerText =
            "Enter a valid Indian mobile number with +91";

        return;

    }


    sendBtn.disabled = true;

    message.innerText = "Sending OTP...";


    try {

        // CLEAR OLD RECAPTCHA

        if (window.recaptchaVerifier) {

            try {
                window.recaptchaVerifier.clear();
            } catch(error) {
                console.log(error);
            }

        }


        // CREATE RECAPTCHA

        window.recaptchaVerifier = new RecaptchaVerifier(
            auth,
            "recaptcha-container",
            {
                size: "normal"
            }
        );


        await window.recaptchaVerifier.render();


        // SEND OTP

        confirmationResult = await signInWithPhoneNumber(
            auth,
            phone,
            window.recaptchaVerifier
        );


        message.innerText =
            "OTP sent successfully!";

    } catch(error) {

        message.innerText = error.message;

        console.error(error);

        confirmationResult = null;

        if (window.recaptchaVerifier) {

            try {
                window.recaptchaVerifier.clear();
            } catch(e) {}

            window.recaptchaVerifier = null;

        }

    } finally {

        sendBtn.disabled = false;

    }

};


// VERIFY OTP

window.verifyOTP = async function() {

    const otp =
        document.getElementById("otp").value.trim();

    const message =
        document.getElementById("message");

    const verifyBtn =
        document.getElementById("verifyBtn");


    if (!confirmationResult) {

        message.innerText =
            "Please get OTP first.";

        return;

    }


    if (!/^\d{6}$/.test(otp)) {

        message.innerText =
            "Enter a valid 6 digit OTP.";

        return;

    }


    verifyBtn.disabled = true;

    message.innerText = "Verifying OTP...";


    try {

        await confirmationResult.confirm(otp);


        message.innerText =
            "Login Successful!";


        window.location.href =
            "./dashboard.html";


    } catch(error) {

        message.innerText =
            "Invalid OTP. Please try again.";

        console.error(error);

    } finally {

        verifyBtn.disabled = false;

    }

};

</script>

</body>
</html>
