<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMPS GOLD - Admin Panel</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #fffaf0;
    margin: 0;
    padding: 15px;
    color: #333;
}

#siteNav {
    margin: -15px -15px 15px;
}

.container {
    max-width: 650px;
    margin: auto;
}

h2 {
    color: #b8860b;
    text-align: center;
}

h3 {
    color: #8a6500;
}

.box {
    background: white;
    padding: 18px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px #ddd;
}

input, textarea, select {
    width: 100%;
    padding: 12px;
    margin: 7px 0;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
}

button {
    width: 100%;
    padding: 13px;
    margin: 7px 0;
    border: none;
    background: #b8860b;
    color: white;
    font-weight: bold;
    border-radius: 7px;
    font-size: 15px;
    cursor: pointer;
}

button:active {
    transform: scale(.97);
    background: #8a6500;
}

button:disabled {
    background: #999;
    cursor: not-allowed;
}

.delete {
    background: #d62828;
}

.logout {
    background: #333;
}

.cancel {
    background: #555;
}

.product, .order {
    border: 1px solid #ddd;
    padding: 13px;
    margin: 12px 0;
    border-radius: 10px;
    background: #fffdf8;
    overflow-wrap: anywhere;
}

.product img {
    width: 100%;
    height: 150px;
    object-fit: contain;
    background: #fff1c2;
}

#adminPanel {
    display: none;
}

#status {
    text-align: center;
    color: green;
    font-weight: bold;
    overflow-wrap: anywhere;
}

#imagePreview {
    width: 150px;
    max-height: 150px;
    object-fit: contain;
    display: none;
    margin: 10px auto;
}

.section-title {
    background: #fff1c2;
    padding: 12px;
    border-radius: 8px;
}

.small {
    font-size: 13px;
    color: #666;
}

/* ORDER PRODUCT IMAGE */

.order-product {
    display: flex;
    gap: 12px;
    align-items: center;
    padding: 10px;
    margin: 10px 0;
    border: 1px solid #eee;
    border-radius: 10px;
    background: white;
}

.order-product-image {
    width: 100px;
    height: 100px;
    object-fit: contain;
    background: #fff1c2;
    border-radius: 8px;
    flex-shrink: 0;
}

.order-product-info {
    flex: 1;
    min-width: 0;
}

.order-product-info p {
    margin: 5px 0;
    font-size: 14px;
    overflow-wrap: anywhere;
}

.order-product-info h4 {
    margin: 0 0 8px;
    color: #8a6500;
}

.no-image {
    width: 100px;
    height: 100px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f5f5f5;
    color: #777;
    border-radius: 8px;
    font-size: 12px;
    text-align: center;
}

</style>
</head>

<body>

<div id="siteNav">
    <p style="text-align:center;padding:15px;">
        Loading Menu...
    </p>
</div>

<div class="container">

<h2>👑 PMPS GOLD ADMIN PANEL</h2>

<!-- ADMIN LOGIN -->

<div class="box" id="loginPanel">

<h3>Admin Login</h3>

<input id="email" type="email" placeholder="Admin Email">

<input id="password" type="password" placeholder="Password">

<button id="loginBtn">LOGIN</button>

</div>

<!-- ADMIN PANEL -->

<div id="adminPanel">

<!-- PRODUCT FORM -->

<div class="box">

<h3 id="formTitle">Add New Product</h3>

<input id="name" placeholder="Product Name">

<input id="retailPrice" type="number" placeholder="Retail Price">

<input id="wholesalePrice" type="number" placeholder="Wholesale Price">

<input id="moq" type="number" placeholder="Wholesale MOQ">

<input id="category" placeholder="Category">

<input id="stock" type="number" placeholder="Stock Quantity">

<input id="image" type="url" placeholder="Product Image URL">

<label>Select Product Image:</label>

<input id="imageFile" type="file" accept="image/*">

<img id="imagePreview">

<textarea id="description" placeholder="Product Description"></textarea>

<button id="saveBtn">ADD PRODUCT</button>

<button id="cancelBtn" class="cancel" style="display:none">
CANCEL EDIT
</button>

</div>

<!-- ALL PRODUCTS -->

<div class="box">

<h3 class="section-title">🛍️ All Products</h3>

<div id="productList">Loading Products...</div>

</div>

<!-- CUSTOMER ORDERS -->

<div class="box">

<h3 class="section-title">📦 Customer Orders</h3>

<button id="refreshOrders">REFRESH ORDERS</button>

<div id="ordersList">Loading Orders...</div>

</div>

<button class="logout" id="logoutBtn">LOGOUT</button>

</div>

<p id="status"></p>

</div>

<script src="./nav.js"></script>

<script type="module">

import { auth, db } from "./firebase.js";

import {
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

import {
    collection,
    addDoc,
    getDocs,
    doc,
    updateDoc,
    deleteDoc,
    serverTimestamp,
    query,
    orderBy
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";


const ADMIN_UID = "k1iqKlSU1pYk16SNnWfajy7EdIw2";

const CLOUD_NAME = "nfmj1mny";

const UPLOAD_PRESET = "pmps_gold";


const loginPanel = document.getElementById("loginPanel");

const adminPanel = document.getElementById("adminPanel");

const statusText = document.getElementById("status");

const productList = document.getElementById("productList");

const ordersList = document.getElementById("ordersList");

const imageFile = document.getElementById("imageFile");

const imagePreview = document.getElementById("imagePreview");


let editId = null;

let uploadedImageURL = "";

let adminReady = false;


// IMAGE FIELD SUPPORT

function getProductImage(item) {

    return item.imageUrl ||
           item.image ||
           item.photo ||
           item.img ||
           item.productImage ||
           (item.images && item.images[0]) ||
           "";

}


// CHECK ADMIN LOGIN

onAuthStateChanged(auth, user => {

    if (user && user.uid === ADMIN_UID) {

        loginPanel.style.display = "none";

        adminPanel.style.display = "block";

        adminReady = true;

        loadProducts();

        loadOrders();

    } else {

        adminReady = false;

        loginPanel.style.display = "block";

        adminPanel.style.display = "none";

    }

});


// LOGIN

document.getElementById("loginBtn").onclick = async () => {

    const email = document.getElementById("email").value.trim();

    const password = document.getElementById("password").value;

    if (!email || !password) {

        statusText.innerText = "Enter Email and Password.";

        return;

    }

    try {

        await signInWithEmailAndPassword(auth, email, password);

        statusText.innerText = "Login Successful!";

    } catch(error) {

        statusText.innerText = error.message;

    }

};


// LOGOUT

document.getElementById("logoutBtn").onclick = async () => {

    await signOut(auth);

    statusText.innerText = "Logged Out Successfully!";

};


// IMAGE PREVIEW

imageFile.addEventListener("change", function() {

    const file = this.files[0];

    if (!file) return;

    if (!file.type.startsWith("image/")) {

        alert("Please select an image.");

        this.value = "";

        return;

    }

    imagePreview.src = URL.createObjectURL(file);

    imagePreview.style.display = "block";

    uploadedImageURL = "";

});


// CLOUDINARY UPLOAD

async function uploadImage() {

    const file = imageFile.files[0];

    if (!file) {

        return document.getElementById("image").value.trim()
            || uploadedImageURL;

    }

    const formData = new FormData();

    formData.append("file", file);

    formData.append("upload_preset", UPLOAD_PRESET);

    const response = await fetch(
        `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
        {
            method: "POST",
            body: formData
        }
    );

    const result = await response.json();

    if (!response.ok) {

        throw new Error(
            result.error?.message || "Image Upload Failed"
        );

    }

    return result.secure_url;

}


// SAVE PRODUCT

document.getElementById("saveBtn").onclick = async () => {

    if (!adminReady || auth.currentUser?.uid !== ADMIN_UID) return;

    const name = document.getElementById("name").value.trim();

    const retailPrice = Number(document.getElementById("retailPrice").value);

    const wholesalePrice = Number(document.getElementById("wholesalePrice").value);

    const moq = Number(document.getElementById("moq").value);

    const category = document.getElementById("category").value.trim();

    const stock = Number(document.getElementById("stock").value);

    const description = document.getElementById("description").value.trim();


    if (
        !name ||
        !category ||
        retailPrice <= 0 ||
        wholesalePrice <= 0 ||
        !Number.isInteger(moq) ||
        moq < 1 ||
        !Number.isInteger(stock) ||
        stock < 0
    ) {

        statusText.innerText =
            "Please fill all product fields correctly!";

        return;

    }


    const saveButton = document.getElementById("saveBtn");

    saveButton.disabled = true;

    saveButton.innerText = "PLEASE WAIT...";


    try {

        const image = await uploadImage();

        const productData = {
            name,
            price: retailPrice,
            retailPrice,
            wholesalePrice,
            moq,
            category,
            stock,
            image,
            description
        };


        if (editId) {

            await updateDoc(
                doc(db, "Products", editId),
                productData
            );

            statusText.innerText = "Product Updated Successfully!";

        } else {

            await addDoc(
                collection(db, "Products"),
                {
                    ...productData,
                    createdAt: serverTimestamp()
                }
            );

            statusText.innerText = "Product Added Successfully!";

        }


        resetForm();

        await loadProducts();

    } catch(error) {

        statusText.innerText = error.message;

    } finally {

        saveButton.disabled = false;

        saveButton.innerText =
            editId ? "UPDATE PRODUCT" : "ADD PRODUCT";

    }

};


// LOAD PRODUCTS

async function loadProducts() {

    if (!adminReady) return;

    productList.innerHTML = "Loading Products...";

    try {

        const snapshot = await getDocs(
            collection(db, "Products")
        );

        productList.innerHTML = "";

        if (snapshot.empty) {

            productList.innerText = "No Products Found.";

            return;

        }

        snapshot.forEach(documentSnapshot => {

            const p = documentSnapshot.data();

            const id = documentSnapshot.id;

            const card = document.createElement("div");

            card.className = "product";


            const productImage = getProductImage(p);

            if (productImage) {

                const img = document.createElement("img");

                img.src = productImage;

                img.alt = p.name || "Product";

                card.appendChild(img);

            }


            const title = document.createElement("h3");

            title.textContent = p.name || "Unnamed Product";


            const retail = document.createElement("p");

            retail.textContent =
                "Retail Price: ₹" + (p.retailPrice || p.price || 0);


            const wholesale = document.createElement("p");

            wholesale.textContent =
                "Wholesale Price: ₹" + (p.wholesalePrice || 0);


            const moqText = document.createElement("p");

            moqText.textContent =
                "Wholesale MOQ: " + (p.moq || 1);


            const categoryText = document.createElement("p");

            categoryText.textContent =
                "Category: " + (p.category || "");


            const stockText = document.createElement("p");

            stockText.textContent =
                "Stock: " + (p.stock ?? 0);


            card.append(
                title,
                retail,
                wholesale,
                moqText,
                categoryText,
                stockText
            );


            const editButton = document.createElement("button");

            editButton.textContent = "EDIT PRODUCT";

            editButton.onclick = () => editProduct(id, p);


            const deleteButton = document.createElement("button");

            deleteButton.textContent = "DELETE PRODUCT";

            deleteButton.className = "delete";

            deleteButton.onclick = () => deleteProduct(id, p.name);


            const stockButton = document.createElement("button");

            stockButton.textContent = "UPDATE STOCK";

            stockButton.onclick = () => updateStock(id, p.stock ?? 0);


            card.append(
                editButton,
                deleteButton,
                stockButton
            );

            productList.appendChild(card);

        });

    } catch(error) {

        productList.innerText = "Error: " + error.message;

    }

}


// EDIT PRODUCT

function editProduct(id, p) {

    editId = id;

    document.getElementById("name").value = p.name || "";

    document.getElementById("retailPrice").value =
        p.retailPrice || p.price || "";

    document.getElementById("wholesalePrice").value =
        p.wholesalePrice || "";

    document.getElementById("moq").value = p.moq || 1;

    document.getElementById("category").value = p.category || "";

    document.getElementById("stock").value = p.stock ?? 0;

    document.getElementById("image").value = getProductImage(p);

    document.getElementById("description").value = p.description || "";


    document.getElementById("formTitle").innerText = "Edit Product";

    document.getElementById("saveBtn").innerText = "UPDATE PRODUCT";

    document.getElementById("cancelBtn").style.display = "block";


    uploadedImageURL = getProductImage(p);

    imageFile.value = "";


    if (getProductImage(p)) {

        imagePreview.src = getProductImage(p);

        imagePreview.style.display = "block";

    }

    window.scrollTo(0, 0);

}


// DELETE PRODUCT

async function deleteProduct(id, name) {

    if (!adminReady) return;

    if (!confirm("Delete " + name + "?")) return;

    try {

        await deleteDoc(doc(db, "Products", id));

        statusText.innerText = "Product Deleted Successfully!";

        loadProducts();

    } catch(error) {

        statusText.innerText = error.message;

    }

}


// UPDATE STOCK

async function updateStock(id, oldStock) {

    if (!adminReady) return;

    const newStock = prompt("Enter New Stock Quantity:", oldStock);

    if (newStock === null) return;

    const quantity = Number(newStock);

    if (!Number.isInteger(quantity) || quantity < 0) {

        alert("Enter a valid stock quantity!");

        return;

    }

    try {

        await updateDoc(
            doc(db, "Products", id),
            {
                stock: quantity
            }
        );

        statusText.innerText = "Stock Updated Successfully!";

        loadProducts();

    } catch(error) {

        statusText.innerText = error.message;

    }

}


// RESET FORM

function resetForm() {

    editId = null;

    document.getElementById("name").value = "";

    document.getElementById("retailPrice").value = "";

    document.getElementById("wholesalePrice").value = "";

    document.getElementById("moq").value = "";

    document.getElementById("category").value = "";

    document.getElementById("stock").value = "";

    document.getElementById("image").value = "";

    document.getElementById("description").value = "";

    imageFile.value = "";

    imagePreview.src = "";

    imagePreview.style.display = "none";

    uploadedImageURL = "";

    document.getElementById("formTitle").innerText = "Add New Product";

    document.getElementById("saveBtn").innerText = "ADD PRODUCT";

    document.getElementById("cancelBtn").style.display = "none";

}


document.getElementById("cancelBtn").onclick = resetForm;


// ===================================
// CUSTOMER ORDERS MANAGEMENT
// ===================================


// LOAD ORDERS

async function loadOrders() {

    if (!adminReady) return;

    ordersList.innerHTML = "Loading Orders...";

    try {

        const q = query(
            collection(db, "Orders"),
            orderBy("createdAt", "desc")
        );

        const snapshot = await getDocs(q);

        ordersList.innerHTML = "";

        if (snapshot.empty) {

            ordersList.innerText = "No Orders Found.";

            return;

        }


        snapshot.forEach(orderDoc => {

            const order = orderDoc.data();

            const id = orderDoc.id;

            const div = document.createElement("div");

            div.className = "order";


            // ORDER INFORMATION

            const title = document.createElement("h3");

            title.textContent = "Order ID: " + id;


            const customer = document.createElement("p");

            customer.textContent =
                "Customer: " + (order.customerName || "");


            const mobile = document.createElement("p");

            mobile.textContent =
                "Mobile: " + (order.mobile || "");


            const address = document.createElement("p");

            address.textContent =
                "Address: " + (order.address || "");


            const pin = document.createElement("p");

            pin.textContent =
                "PIN: " + (order.pin || "");


            const payment = document.createElement("p");

            payment.textContent =
                "Payment: " + (order.paymentMethod || "");


            const total = document.createElement("p");

            total.textContent =
                "Total: ₹" + (order.totalAmount || 0);


            const currentStatus = document.createElement("p");

            currentStatus.textContent =
                "Current Status: " + (order.status || "Pending");


            const productsTitle = document.createElement("h4");

            productsTitle.textContent = "📦 Ordered Products";


            div.append(
                title,
                customer,
                mobile,
                address,
                pin,
                payment,
                total,
                currentStatus,
                productsTitle
            );


            // PRODUCT DETAILS WITH IMAGES

            if (Array.isArray(order.products)) {

                order.products.forEach(item => {

                    const productBox = document.createElement("div");

                    productBox.className = "order-product";


                    // IMAGE

                    const imageURL = getProductImage(item);

                    if (imageURL) {

                        const img = document.createElement("img");

                        img.className = "order-product-image";

                        img.src = imageURL;

                        img.alt = item.name || "Product";

                        img.onerror = function() {

                            img.style.display = "none";

                        };

                        productBox.appendChild(img);

                    } else {

                        const noImage = document.createElement("div");

                        noImage.className = "no-image";

                        noImage.textContent = "Image unavailable";

                        productBox.appendChild(noImage);

                    }


                    // PRODUCT INFO

                    const info = document.createElement("div");

                    info.className = "order-product-info";


                    const name = document.createElement("h4");

                    name.textContent = item.name || "Product";


                    const type = document.createElement("p");

                    type.textContent =
                        "Type: " +
                        (
                            item.orderType === "wholesale"
                            ? "Wholesale"
                            : "Retail"
                        );


                    const quantity = document.createElement("p");

                    quantity.textContent =
                        "Quantity: " + (item.quantity || 1);


                    const price = document.createElement("p");

                    price.textContent =
                        "Price: ₹" + (item.price || 0);


                    const subtotal = document.createElement("p");

                    subtotal.textContent =
                        "Subtotal: ₹" +
                        (
                            item.subtotal ??
                            ((Number(item.price) || 0) *
                            (Number(item.quantity) || 1))
                        );


                    info.append(
                        name,
                        type,
                        quantity,
                        price,
                        subtotal
                    );


                    productBox.appendChild(info);

                    div.appendChild(productBox);

                });

            }


            // STATUS SELECT

            const select = document.createElement("select");

            select.id = "status-" + id;


            const statuses = [
                "Pending",
                "Confirmed",
                "Processing",
                "Shipped",
                "Delivered",
                "Cancelled"
            ];


            statuses.forEach(s => {

                const option = document.createElement("option");

                option.value = s;

                option.textContent = s;

                select.appendChild(option);

            });


            select.value = order.status || "Pending";


            // UPDATE BUTTON

            const updateButton = document.createElement("button");

            updateButton.textContent = "UPDATE ORDER STATUS";


            updateButton.onclick = async () => {

                await updateOrderStatus(
                    id,
                    order,
                    select.value,
                    updateButton
                );

            };


            div.append(select, updateButton);

            ordersList.appendChild(div);

        });

    } catch(error) {

        ordersList.innerText =
            "Error Loading Orders: " + error.message;

    }

}


// UPDATE ORDER STATUS + NOTIFICATION

async function updateOrderStatus(
    orderId,
    order,
    newStatus,
    button
) {

    if (!adminReady || auth.currentUser?.uid !== ADMIN_UID) {

        alert("Admin Login Required!");

        return;

    }


    const oldStatus = order.status || "Pending";

    if (newStatus === oldStatus) {

        alert("Status is already " + newStatus);

        return;

    }


    if (!order.userId) {

        alert(
            "এই অর্ডারে Customer User ID নেই। " +
            "Order Status পরিবর্তন করা যাবে, কিন্তু Notification পাঠানো যাবে না।"
        );

        return;

    }


    button.disabled = true;

    button.textContent = "UPDATING...";


    try {

        // STEP 1: UPDATE ORDER

        await updateDoc(
            doc(db, "Orders", orderId),
            {
                status: newStatus,
                updatedAt: serverTimestamp()
            }
        );


        // STEP 2: CREATE CUSTOMER NOTIFICATION

        await addDoc(
            collection(db, "Notifications"),
            {

                userId: order.userId,

                orderId: orderId,

                title: "Order Status Updated",

                message:
                    "Your PMPS GOLD order status is now " +
                    newStatus,

                status: newStatus,

                read: false,

                createdAt: serverTimestamp()

            }
        );


        alert(
            "Order Status Updated Successfully!\n" +
            "Customer Notification Created!"
        );


        loadOrders();


    } catch(error) {

        alert(
            "Order Status Update / Notification Error: " +
            error.message
        );

        loadOrders();

    } finally {

        button.disabled = false;

        button.textContent = "UPDATE ORDER STATUS";

    }

}


// REFRESH ORDERS

document.getElementById("refreshOrders").onclick = loadOrders;

</script>

</body>
</html>
