<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMPS GOLD - Festival Management</title>
<link rel="stylesheet" href="../../assets/css/admin.css">
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;padding:15px}
h2{color:#a77b00}
.box,.festival{background:white;padding:18px;border-radius:10px;margin:15px 0}
input,textarea,button{width:100%;padding:12px;margin:7px 0;box-sizing:border-box}
input,textarea{border:1px solid #ccc;border-radius:6px}
button{border:0;border-radius:6px;background:#b8860b;color:white;font-weight:bold}
.delete{background:#c62828}
.festival img{width:100%;max-height:180px;object-fit:cover;border-radius:8px}
</style>
</head>
<body>

<h2>🎉 Festival Management</h2>
<a href="../dashboard.html">← Back to Dashboard</a>

<div class="box">
<h3>নতুন Festival যোগ করুন</h3>

<input id="name" placeholder="Festival Name (যেমন Durga Puja)">
<input id="title" placeholder="Homepage Festival Title">
<textarea id="messageText" placeholder="Festival Message"></textarea>

<input id="imageFile" type="file" accept="image/*">
<button id="uploadBtn">UPLOAD FESTIVAL IMAGE</button>
<p id="uploadMessage"></p>

<input id="image" placeholder="Festival Image URL" readonly>
<input id="startDate" type="date">
<input id="endDate" type="date">

<button id="saveBtn">SAVE FESTIVAL</button>
<p id="message"></p>
</div>

<h3>বর্তমান Festivals</h3>
<div id="festivalList">Loading...</div>

<script type="module">
import {db,auth} from "../../firebase.js";

import {
 collection,addDoc,getDocs,doc,deleteDoc,serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

import {
 onAuthStateChanged,signOut
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const ADMIN_UID="k1iqKlSU1pYk16SNnWfajy7EdIw2";
const CLOUD_NAME="nfmj1mny";
const UPLOAD_PRESET="pmps_gold";

let adminReady=false;
const $=id=>document.getElementById(id);

onAuthStateChanged(auth,user=>{
 if(!user || user.uid!==ADMIN_UID){
  signOut(auth);
  window.location.replace("../index.html");
  return;
 }
 adminReady=true;
 loadFestivals();
});

$("uploadBtn").onclick=async()=>{
 if(!adminReady)return;

 const file=$("imageFile").files[0];

 if(!file){
  $("uploadMessage").innerText="প্রথমে একটি ছবি নির্বাচন করুন।";
  return;
 }

 if(!file.type.startsWith("image/") || file.size>10*1024*1024){
  $("uploadMessage").innerText="সঠিক Image দিন (সর্বোচ্চ 10 MB)।";
  return;
 }

 $("uploadBtn").disabled=true;
 $("uploadMessage").innerText="Uploading...";

 try{
  const formData=new FormData();
  formData.append("file",file);
  formData.append("upload_preset",UPLOAD_PRESET);

  const response=await fetch(
   `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
   {method:"POST",body:formData}
  );

  const result=await response.json();

  if(!response.ok)throw new Error(result.error?.message||"Upload failed");

  $("image").value=result.secure_url;
  $("uploadMessage").innerText="✅ Festival Image Upload সফল হয়েছে!";

 }catch(error){
  $("uploadMessage").innerText="Error: "+error.message;
 }finally{
  $("uploadBtn").disabled=false;
 }
};

$("saveBtn").onclick=async()=>{
 if(!adminReady)return;

 const name=$("name").value.trim();
 const title=$("title").value.trim();
 const message=$("messageText").value.trim();
 const image=$("image").value.trim();
 const startDate=$("startDate").value;
 const endDate=$("endDate").value;

 if(!name || !title){
  $("message").innerText="Festival Name এবং Title দিন।";
  return;
 }

 if(startDate && endDate && endDate<startDate){
  $("message").innerText="End Date, Start Date-এর আগে হতে পারবে না।";
  return;
 }

 $("saveBtn").disabled=true;
 $("message").innerText="Saving...";

 try{
  await addDoc(collection(db,"Festivals"),{
   name,title,message,image,startDate,endDate,
   active:true,
   createdAt:serverTimestamp()
  });

  $("message").innerText="Festival সফলভাবে Save হয়েছে!";

  ["name","title","messageText","image","imageFile","startDate","endDate"]
   .forEach(id=>$(id).value="");

  await loadFestivals();

 }catch(error){
  $("message").innerText="Error: "+error.message;
 }finally{
  $("saveBtn").disabled=false;
 }
};

async function loadFestivals(){
 $("festivalList").innerText="Loading...";

 try{
  const snapshot=await getDocs(collection(db,"Festivals"));
  $("festivalList").innerHTML="";

  if(snapshot.empty){
   $("festivalList").innerText="এখনও কোনো Festival নেই।";
   return;
  }

  snapshot.forEach(item=>{
   const f=item.data();
   const box=document.createElement("div");
   box.className="festival";

   const img=document.createElement("img");
   img.src=f.image||"";
   img.alt=f.name||"Festival";

   const title=document.createElement("h3");
   title.textContent=f.name||"";

   const details=document.createElement("p");
   details.textContent=(f.title||"")+" | "+
    (f.startDate||"")+" থেকে "+(f.endDate||"");

   const msg=document.createElement("p");
   msg.textContent=f.message||"";

   const remove=document.createElement("button");
   remove.className="delete";
   remove.textContent="DELETE FESTIVAL";

   remove.onclick=async()=>{
    if(!confirm("এই Festival মুছে ফেলতে চান?"))return;
    try{
     await deleteDoc(doc(db,"Festivals",item.id));
     await loadFestivals();
    }catch(error){
     alert("Error: "+error.message);
    }
   };

   box.append(img,title,details,msg,remove);
   $("festivalList").append(box);
  });

 }catch(error){
  $("festivalList").innerText="Error: "+error.message;
 }
}
</script>

</body>
</html>
