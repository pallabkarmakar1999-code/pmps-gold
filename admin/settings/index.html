<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMPS GOLD - Store Settings</title>
<link rel="stylesheet" href="../../assets/css/admin.css">
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;padding:15px}
h2{color:#a77b00}
.box{background:white;padding:18px;border-radius:10px;margin:15px 0}
input,textarea,button{width:100%;padding:12px;margin:7px 0;box-sizing:border-box}
input,textarea{border:1px solid #ccc;border-radius:6px}
button{border:0;border-radius:6px;background:#b8860b;color:white;font-weight:bold}
label{display:block;margin-top:10px}
</style>
</head>
<body>

<h2>⚙️ Store Settings</h2>
<a href="../dashboard.html">← Back to Dashboard</a>

<div class="box">
<h3>Store Information</h3>

<label>দোকানের নাম</label>
<input id="storeName" placeholder="PMPS GOLD">

<label>যোগাযোগের নম্বর</label>
<input id="phone" placeholder="Mobile Number">

<label>WhatsApp নম্বর</label>
<input id="whatsapp" placeholder="WhatsApp Number">

<label>ইমেল</label>
<input id="email" type="email" placeholder="Store Email">

<label>দোকানের ঠিকানা</label>
<textarea id="address" placeholder="Store Address"></textarea>

<label>ওয়েবসাইটের ছোট বিবরণ</label>
<textarea id="description" placeholder="About your store"></textarea>
</div>

<div class="box">
<h3>Shipping Settings</h3>

<label>সাধারণ Delivery Charge (₹)</label>
<input id="deliveryCharge" type="number" min="0" placeholder="0">

<label>Free Delivery-এর জন্য ন্যূনতম অর্ডার (₹)</label>
<input id="freeDeliveryMinimum" type="number" min="0" placeholder="0">
</div>

<button id="saveBtn">SAVE STORE SETTINGS</button>
<p id="message"></p>

<script type="module">
import {db,auth} from "../../firebase.js";

import {
 doc,getDoc,setDoc,serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

import {
 onAuthStateChanged,signOut
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const ADMIN_UID="k1iqKlSU1pYk16SNnWfajy7EdIw2";
const $=id=>document.getElementById(id);

let adminReady=false;

const fields=[
 "storeName","phone","whatsapp","email",
 "address","description",
 "deliveryCharge","freeDeliveryMinimum"
];

onAuthStateChanged(auth,async user=>{
 if(!user || user.uid!==ADMIN_UID){
  await signOut(auth);
  window.location.replace("../index.html");
  return;
 }

 adminReady=true;
 await loadSettings();
});

async function loadSettings(){
 $("message").innerText="Loading...";

 try{
  const snapshot=await getDoc(doc(db,"Storefront","settings"));

  if(snapshot.exists()){
   const data=snapshot.data();

   fields.forEach(id=>{
    if(data[id]!==undefined){
     $(id).value=data[id];
    }
   });
  }

  $("message").innerText="Settings Loaded.";

 }catch(error){
  $("message").innerText="Error: "+error.message;
 }
}

$("saveBtn").onclick=async()=>{
 if(!adminReady)return;

 const data={};

 fields.forEach(id=>{
  const value=$(id).value.trim();

  if(id==="deliveryCharge" || id==="freeDeliveryMinimum"){
   data[id]=Number(value||0);
  }else{
   data[id]=value;
  }
 });

 data.updatedAt=serverTimestamp();

 $("saveBtn").disabled=true;
 $("message").innerText="Saving...";

 try{
  await setDoc(
   doc(db,"Storefront","settings"),
   data,
   {merge:true}
  );

  $("message").innerText="✅ Store Settings Save হয়েছে!";

 }catch(error){
  $("message").innerText="Error: "+error.message;
 }finally{
  $("saveBtn").disabled=false;
 }
};
</script>

</body>
</html>
