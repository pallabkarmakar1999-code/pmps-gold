<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMPS GOLD - Homepage Management</title>
<link rel="stylesheet" href="../../assets/css/admin.css">
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;padding:15px}
h2{color:#a77b00}
.box{background:white;padding:18px;border-radius:10px;margin:15px 0}
input,textarea,button{width:100%;padding:12px;margin:7px 0;box-sizing:border-box}
input,textarea{border:1px solid #ccc;border-radius:6px}
button{border:0;border-radius:6px;background:#b8860b;color:white;font-weight:bold}
label{display:block;margin-top:12px}
</style>
</head>
<body>

<h2>🏠 Homepage Management</h2>
<a href="../dashboard.html">← Back to Dashboard</a>

<div class="box">
<h3>Popup Settings</h3>

<label>
<input type="checkbox" id="popupEnabled" style="width:auto">
Homepage Popup চালু রাখুন
</label>

<input id="popupTitle" placeholder="Popup Title">
<input id="popupSubtitle" placeholder="Popup Subtitle">
<textarea id="popupMessage" placeholder="Popup Message"></textarea>
</div>

<div class="box">
<h3>Festival Settings</h3>

<label>
<input type="checkbox" id="festivalEnabled" style="width:auto">
Festival Section চালু রাখুন
</label>

<input id="festivalName" placeholder="Festival Name">
<input id="festivalTitle" placeholder="Festival Title">
<textarea id="festivalMessage" placeholder="Festival Message"></textarea>
</div>

<div class="box">
<h3>Product Section Settings</h3>

<label>
<input type="checkbox" id="bestSellerEnabled" style="width:auto">
Best Sellers Section চালু রাখুন
</label>

<label>
<input type="checkbox" id="newArrivalEnabled" style="width:auto">
New Arrivals Section চালু রাখুন
</label>
</div>

<button id="saveBtn">SAVE HOMEPAGE SETTINGS</button>
<p id="message"></p>

<script type="module">
import {db,auth} from "../../firebase.js";

import {
 doc,getDoc,setDoc,serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

import {
 onAuthStateChanged,signOut
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const ADMIN_UID="k1iqKlSU1pYk16SNnWfajy7EdIw2";
let adminReady=false;

const $=id=>document.getElementById(id);

const textFields=[
 "popupTitle","popupSubtitle","popupMessage",
 "festivalName","festivalTitle","festivalMessage"
];

onAuthStateChanged(auth,async user=>{
 if(!user || user.uid!==ADMIN_UID){
  signOut(auth);
  window.location.replace("../index.html");
  return;
 }

 adminReady=true;
 await loadSettings();
});

async function loadSettings(){
 $("message").innerText="Loading Settings...";

 try{
  const ref=doc(db,"Storefront","settings");
  const snapshot=await getDoc(ref);

  if(snapshot.exists()){
   const data=snapshot.data();

   textFields.forEach(id=>{
    $(id).value=data[id]||"";
   });

   [
    "popupEnabled",
    "festivalEnabled",
    "bestSellerEnabled",
    "newArrivalEnabled"
   ].forEach(id=>{
    $(id).checked=data[id]===true;
   });
  }

  $("message").innerText="Settings Loaded.";

 }catch(error){
  $("message").innerText="Error: "+error.message;
 }
}

$("saveBtn").onclick=async()=>{
 if(!adminReady)return;

 const data={};

 textFields.forEach(id=>{
  data[id]=$(id).value.trim();
 });

 [
  "popupEnabled",
  "festivalEnabled",
  "bestSellerEnabled",
  "newArrivalEnabled"
 ].forEach(id=>{
  data[id]=$(id).checked;
 });

 data.updatedAt=serverTimestamp();

 $("saveBtn").disabled=true;
 $("message").innerText="Saving...";

 try{
  await setDoc(doc(db,"Storefront","settings"),data,{merge:true});
  $("message").innerText="✅ Homepage Settings Save হয়েছে!";
 }catch(error){
  $("message").innerText="Error: "+error.message;
 }finally{
  $("saveBtn").disabled=false;
 }
};
</script>

</body>
</html>
